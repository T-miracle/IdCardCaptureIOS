name: Build iOS ID-card Capture Plugin

on:
  workflow_dispatch:
  push:
    paths:
      - 'IdCardCaptureIOS/**'
      - 'IdCardCaptureIOS.xcodeproj/**'
      - 'tests/**'
      - 'ios-package.json'
      - '.github/workflows/build-idcard-capture-ios.yml'

permissions:
  contents: read

jobs:
  build-framework:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      PROJECT: IdCardCaptureIOS.xcodeproj
      SCHEME: IdCardCaptureIOS
      DCLOUD_SDK_REPOSITORY: ${{ vars.DCLOUD_IOS_SDK_REPOSITORY }}
      DCLOUD_SDK_RELEASE_TAG: ${{ vars.DCLOUD_IOS_SDK_RELEASE_TAG }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Stamp camera build identifier
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("ios-package.json"))["version"])')"
          CAPTURE_BUILD_ID="IDCapture ${VERSION}-${GITHUB_SHA:0:8}"
          printf '#define LQ_CAPTURE_BUILD_ID @"%s"\n' "$CAPTURE_BUILD_ID" > IdCardCaptureIOS/LQCaptureBuild.h
          echo "CAPTURE_BUILD_ID=$CAPTURE_BUILD_ID" >> "$GITHUB_ENV"

      - name: Verify preview layout and capture state on iOS Simulator
        run: bash tests/run-ios-regressions.sh

      - name: Upload camera regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camera-regression-results
          path: build/regression-result.json
          if-no-files-found: ignore

      - name: Download DCloud iOS SDK from private release
        env:
          GH_TOKEN: ${{ secrets.DCLOUD_SDK_REPO_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error title=Missing SDK token::DCLOUD_SDK_REPO_TOKEN was not injected into this workflow run."
            exit 1
          fi
          test -n "$DCLOUD_SDK_REPOSITORY" || { echo "::error::Set Actions variable DCLOUD_IOS_SDK_REPOSITORY."; exit 1; }
          test -n "$DCLOUD_SDK_RELEASE_TAG" || { echo "::error::Set Actions variable DCLOUD_IOS_SDK_RELEASE_TAG."; exit 1; }
          echo "DCloud SDK download credential was injected."
          mkdir -p vendor/download vendor/dcloud-ios-sdk
          echo "Checking private release $DCLOUD_SDK_REPOSITORY@$DCLOUD_SDK_RELEASE_TAG ..."
          gh release view "$DCLOUD_SDK_RELEASE_TAG" \
            --repo "$DCLOUD_SDK_REPOSITORY" \
            --json tagName,name,assets > vendor/release-info.json
          jq -e '.assets[] | select(.name == "SDK.zip")' vendor/release-info.json > /dev/null || {
            echo "::error title=SDK asset missing::Release must include an asset named SDK.zip."
            exit 1
          }
          echo "Downloading SDK.zip ..."
          gh release download "$DCLOUD_SDK_RELEASE_TAG" \
            --repo "$DCLOUD_SDK_REPOSITORY" \
            --pattern 'SDK.zip' \
            --dir vendor/download
          SDK_ARCHIVE="vendor/download/SDK.zip"
          test -s "$SDK_ARCHIVE" || {
            echo "::error title=SDK download failed::SDK.zip was not downloaded or is empty."
            exit 1
          }
          echo "Extracting SDK.zip ..."
          ditto -x -k "$SDK_ARCHIVE" vendor/dcloud-ios-sdk

          SDK_HEADER="$(find vendor/dcloud-ios-sdk -type f -name 'DCUniModule.h' -print -quit)"
          test -n "$SDK_HEADER" || {
            echo "::error title=Invalid SDK archive::DCUniModule.h was not found after extraction."
            exit 1
          }
          SDK_INCLUDE_DIR="$(dirname "$SDK_HEADER")"
          SDK_INC_DIR="$(dirname "$SDK_INCLUDE_DIR")"
          echo "DCUNI_SDK_INCLUDE_DIR=$SDK_INCLUDE_DIR" >> "$GITHUB_ENV"
          echo "DCUNI_SDK_INC_DIR=$SDK_INC_DIR" >> "$GITHUB_ENV"

      - name: Verify injected DCloud SDK
        run: |
          test -f "$DCUNI_SDK_INCLUDE_DIR/DCUniModule.h"
          xcodebuild -version

      - name: Build static framework for physical iPhone/iPad devices
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            BUILD_DIR="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package local Uni-App plugin artifact
        run: |
          mkdir -p artifact/ios
          cp -R build/Release-iphoneos/UniIdCardCapture.framework artifact/ios/
          cp ios-package.json artifact/package.json
          strings artifact/ios/UniIdCardCapture.framework/UniIdCardCapture > build/framework-strings.txt
          grep -F "$CAPTURE_BUILD_ID" build/framework-strings.txt
          printf 'build=%s\ncommit=%s\nrun=%s\n' "$CAPTURE_BUILD_ID" "$GITHUB_SHA" "$GITHUB_RUN_ID" > artifact/BUILD-INFO.txt
          shasum -a 256 artifact/ios/UniIdCardCapture.framework/UniIdCardCapture >> artifact/BUILD-INFO.txt
          ditto -c -k --sequesterRsrc --keepParent artifact UniIdCardCapture-ios-plugin.zip

      - name: Upload plugin framework
        uses: actions/upload-artifact@v4
        with:
          name: UniIdCardCapture-ios-plugin
          path: UniIdCardCapture-ios-plugin.zip
          retention-days: 30
